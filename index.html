<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>私の初めてのWebページ</title>
</head>
<body>
    <h1>こんにちは、世界！</h1>
    <p>これは私の最初のHTMLページです。</p>
    <ul>
        <li>HTMLは簡単！</li>
        <li>楽しい！</li>
        <li>すぐに覚えられる！</li>
    </ul>


    <!-- ログインフォームの追加 -->
    <p>ユーザー名：</p>
    <input type="text" name="username" placeholder="ユーザー名を入力">

    <p>パスワード：</p>
    <input type="password" name="password" placeholder="パスワードを入力">


    <br><br>

    <!-- ボタンの追加 -->
    <button onclick="alert('ボタンがクリックされました！')">クリックしてね</button>

    <br><br>

    <!-- divタグの追加 -->
    <div id="unique-section" class="content-section">
        ここはdivタグで囲まれたセクションです。
    </div>

    <br><br>
    
<!-- 有効なリンクの追加 -->
<a href="subpage.html">別のページへ移動</a>

</body>
</html>
